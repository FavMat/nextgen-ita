<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Ciao Mirta</title>
  <meta name="description" content="Sign in to Ciao Mirta — one account, all tools." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/ng.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .auth-wrap {
      width: 100%; max-width: 440px;
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 40px 36px 32px;
      box-shadow: 0 24px 60px rgba(0,0,0,.3);
      position: relative; z-index: 10;
    }
    .auth-brand {
      text-align: center; margin-bottom: 30px;
    }
    .auth-brand a {
      font-family: var(--f-display);
      font-size: 30px; font-weight: 400;
      color: var(--fg); text-decoration: none;
      letter-spacing: -.02em;
    }
    .auth-brand em { color: var(--green); font-style: italic; }
    .auth-eyebrow {
      font-family: var(--f-mono); font-size: 10px;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--fg-3); margin-bottom: 8px;
    }
    .auth-title {
      font-family: var(--f-display); font-size: 26px;
      letter-spacing: -.02em; margin-bottom: 6px;
      color: var(--fg);
    }
    .auth-sub {
      font-size: 13px; color: var(--fg-2);
      margin-bottom: 28px; line-height: 1.5;
    }
    /* PRIMARY: Google */
    .btn-google {
      width: 100%; display: inline-flex;
      align-items: center; justify-content: center; gap: 10px;
      padding: 13px 18px;
      background: #fff; color: #111;
      border: 1px solid #ddd; border-radius: 12px;
      font-family: var(--f-sans); font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all .15s;
    }
    .btn-google:hover {
      background: #f7f7f7;
      box-shadow: 0 4px 12px rgba(0,0,0,.18);
      transform: translateY(-1px);
    }
    .btn-google svg { width: 18px; height: 18px; }

    .divider {
      display: flex; align-items: center; gap: 14px;
      margin: 22px 0 18px;
      font-family: var(--f-mono); font-size: 10px;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--fg-3);
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--line);
    }

    /* MAGIC LINK */
    .magic-row { display: flex; gap: 8px; }
    .magic-row input {
      flex: 1; min-width: 0;
      padding: 12px 14px;
      background: var(--bg-2); color: var(--fg);
      border: 1px solid var(--line-2); border-radius: 10px;
      font-family: var(--f-sans); font-size: 14px;
      transition: border-color .15s;
    }
    .magic-row input:focus {
      outline: none; border-color: var(--green);
      box-shadow: 0 0 0 3px var(--green-10);
    }
    .btn-magic {
      padding: 12px 16px;
      background: var(--green); color: #fff;
      border: none; border-radius: 10px;
      font-family: var(--f-sans); font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all .15s;
      white-space: nowrap;
    }
    .btn-magic:hover { background: var(--green-hi); }
    .btn-magic:disabled { opacity: .6; cursor: not-allowed; }

    /* PASSWORD (collapsed) */
    .pw-toggle {
      margin-top: 22px;
      font-size: 12px; color: var(--fg-2);
      text-align: center;
      cursor: pointer;
      background: none; border: none;
      font-family: var(--f-sans);
      width: 100%;
      padding: 8px;
    }
    .pw-toggle:hover { color: var(--green); }
    .pw-form { display: none; margin-top: 14px; }
    .pw-form.open { display: block; }
    .pw-form input {
      width: 100%; box-sizing: border-box;
      padding: 12px 14px; margin-bottom: 8px;
      background: var(--bg-2); color: var(--fg);
      border: 1px solid var(--line-2); border-radius: 10px;
      font-family: var(--f-sans); font-size: 14px;
    }
    .pw-form input:focus {
      outline: none; border-color: var(--green);
      box-shadow: 0 0 0 3px var(--green-10);
    }
    .pw-actions {
      display: flex; gap: 8px; margin-top: 4px;
    }
    .pw-actions button {
      flex: 1; padding: 11px;
      border-radius: 10px;
      font-family: var(--f-sans); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all .15s;
    }
    .btn-pw-in {
      background: var(--green); color: #fff; border: none;
    }
    .btn-pw-in:hover { background: var(--green-hi); }
    .btn-pw-up {
      background: transparent; color: var(--fg-1);
      border: 1px solid var(--line-2);
    }
    .btn-pw-up:hover { color: var(--fg); border-color: var(--line-3); }

    .feedback {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }
    .feedback.ok {
      display: block;
      background: var(--green-10);
      color: var(--green-hi);
      border: 1px solid var(--green-20);
    }
    .feedback.err {
      display: block;
      background: rgba(220, 60, 60, .08);
      color: #ff8080;
      border: 1px solid rgba(220, 60, 60, .25);
    }

    .auth-foot {
      margin-top: 26px; padding-top: 20px;
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: 11px; color: var(--fg-3); line-height: 1.6;
    }
    .auth-foot a { color: var(--fg-2); text-decoration: underline; }
    .auth-foot a:hover { color: var(--green); }
  </style>
</head>
<body>
<div class="bg-grid"></div>
<canvas class="bg-canvas"></canvas>
<div class="grain"></div>

<div class="auth-wrap">
  <div class="auth-brand">
    <a href="/">Ciao<em>Mirta</em></a>
  </div>

  <div class="auth-eyebrow">→ Sign in</div>
  <h1 class="auth-title">Welcome back.</h1>
  <p class="auth-sub">One account for the whole ecosystem. No password to remember.</p>

  <!-- GOOGLE -->
  <button class="btn-google" id="btn-google" type="button">
    <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
      <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.79 2.72v2.26h2.9c1.7-1.56 2.69-3.87 2.69-6.62z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.06-3.72H.96v2.33A9 9 0 0 0 9 18z"/>
      <path fill="#FBBC04" d="M3.94 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.16.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l2.98-2.34z"/>
      <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58A9 9 0 0 0 9 0 9 9 0 0 0 .96 4.96l2.98 2.34C4.66 5.17 6.65 3.58 9 3.58z"/>
    </svg>
    Continue with Google
  </button>

  <div class="divider">or</div>

  <!-- MAGIC LINK -->
  <form class="magic-row" id="form-magic" autocomplete="email">
    <input type="email" id="email-magic" required placeholder="you@email.com" autocomplete="email" />
    <button class="btn-magic" type="submit" id="btn-magic">Email me a link</button>
  </form>

  <!-- PASSWORD (collapsed) -->
  <button class="pw-toggle" type="button" id="pw-toggle">Or sign in with a password →</button>
  <div class="pw-form" id="pw-form">
    <input type="email" id="email-pw" placeholder="you@email.com" autocomplete="email" />
    <input type="password" id="pass-pw" placeholder="Password" autocomplete="current-password" />
    <div class="pw-actions">
      <button class="btn-pw-in" type="button" id="btn-pw-in">Sign in</button>
      <button class="btn-pw-up" type="button" id="btn-pw-up">Create account</button>
    </div>
  </div>

  <div class="feedback" id="fb"></div>

  <div class="auth-foot">
    By signing in you agree to our <a href="/privacy.html">Privacy Policy</a>.<br>
    Need help? Email <a href="mailto:matteo@ciaomirta.it">matteo@ciaomirta.it</a>.
  </div>
</div>

<script src="assets/ng.js"></script>
<script src="assets/auth.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const returnTo = params.get('return_to') || '/account.html';
  const fb = document.getElementById('fb');

  function show(kind, msg) {
    fb.className = 'feedback ' + kind;
    fb.textContent = msg;
  }
  function reset() { fb.className = 'feedback'; fb.textContent = ''; }

  async function ready() {
    if (window.ciaomirtaAuth) return window.ciaomirtaAuth;
    return new Promise(r => window.addEventListener('ciaomirta:auth-ready', () => r(window.ciaomirtaAuth), { once: true }));
  }

  ready().then(auth => {
    // If already signed in, redirect away
    auth.getSession().then(s => { if (s) location.href = returnTo; });

    document.getElementById('btn-google').addEventListener('click', async () => {
      reset();
      try { await auth.signInWithGoogle(returnTo); }
      catch (e) { show('err', e.message || 'Google sign-in failed.'); }
    });

    document.getElementById('form-magic').addEventListener('submit', async (e) => {
      e.preventDefault();
      reset();
      const email = document.getElementById('email-magic').value.trim();
      if (!email) return;
      const btn = document.getElementById('btn-magic');
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        await auth.signInWithMagicLink(email, returnTo);
        show('ok', 'Check your email — we sent you a sign-in link.');
        btn.textContent = 'Link sent';
      } catch (e) {
        show('err', e.message || 'Could not send link.');
        btn.disabled = false; btn.textContent = 'Email me a link';
      }
    });

    document.getElementById('pw-toggle').addEventListener('click', () => {
      const f = document.getElementById('pw-form');
      const t = document.getElementById('pw-toggle');
      const open = f.classList.toggle('open');
      t.textContent = open ? 'Hide password sign in' : 'Or sign in with a password →';
    });

    document.getElementById('btn-pw-in').addEventListener('click', async () => {
      reset();
      const email = document.getElementById('email-pw').value.trim();
      const pass  = document.getElementById('pass-pw').value;
      if (!email || !pass) return show('err', 'Email and password required.');
      try {
        await auth.signInWithPassword(email, pass);
        location.href = returnTo;
      } catch (e) { show('err', e.message || 'Wrong email or password.'); }
    });

    document.getElementById('btn-pw-up').addEventListener('click', async () => {
      reset();
      const email = document.getElementById('email-pw').value.trim();
      const pass  = document.getElementById('pass-pw').value;
      if (!email || !pass) return show('err', 'Email and password required.');
      if (pass.length < 8) return show('err', 'Password must be at least 8 characters.');
      try {
        await auth.signUpWithPassword(email, pass);
        show('ok', 'Account created. Check your email to confirm.');
      } catch (e) { show('err', e.message || 'Sign up failed.'); }
    });
  });
})();
</script>
</body>
</html>
